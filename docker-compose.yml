version: '3.8'

services:
  facemark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facemark_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INSIGHTFACE_MODEL=buffalo_sc
      - SECRET_KEY=facemark-production-secret-change-me
      - DATABASE_URL=sqlite:////app/data/face_attendance.db
    volumes:
      - facemark_data:/app/data
      - facemark_models:/app/models

volumes:
  facemark_data:
  facemark_models:
